name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run WeChat minigame tests
        run: node --test minigame/test/*.test.cjs

      - name: Render minigame visual snapshots
        run: node minigame/tools/render-snapshots.js

      - name: Build H5 preview bundle
        run: node huawei-h5/build.js
